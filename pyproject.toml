[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-chunking-boundary-detector"
version = "0.1.0"
description = "Vocabulary entropy and discourse shift analyzer that detects natural semantic boundaries to eliminate arbitrary fixed-size chunking splits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-chunking-boundary-detector = "semantic_chunking_boundary_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_chunking_boundary_detector*"]
